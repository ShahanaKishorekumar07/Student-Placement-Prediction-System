<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Prediction</title>

    <link rel="stylesheet" href="/web/style.css">
</head>

<body>

    <div class="container">

        <h1>Student Placement Prediction</h1>

        <p class="subtitle">
            Enter student details to predict placement status
        </p>

        <form id="placementForm">

            <div class="form-group">
                <label for="cgpa">CGPA</label>
                <input type="number"
                       id="cgpa"
                       step="0.1"
                       min="0"
                       max="10"
                       placeholder="Enter CGPA"
                       required>
            </div>

            <div class="form-group">
                <label for="attendance">Attendance (%)</label>
                <input type="number"
                       id="attendance"
                       min="0"
                       max="100"
                       placeholder="Enter attendance"
                       required>
            </div>

            <div class="form-group">
                <label for="internships">Number of Internships</label>
                <input type="number"
                       id="internships"
                       min="0"
                       placeholder="Enter internships"
                       required>
            </div>

            <div class="form-group">
                <label for="projects">Number of Projects</label>
                <input type="number"
                       id="projects"
                       min="0"
                       placeholder="Enter projects"
                       required>
            </div>

            <div class="form-group">
                <label for="backlogs">Number of Backlogs</label>
                <input type="number"
                       id="backlogs"
                       min="0"
                       placeholder="Enter backlogs"
                       required>
            </div>

            <button type="submit">
                Predict Placement
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="/web/script.js"></script>

</body>

</html>
